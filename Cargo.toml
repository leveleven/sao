[workspace]
resolver = "2"
members = [
    "crates/sao-protocol",
    "crates/sao-core",
    "crates/sao-server",
    "crates/sao-client",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"
rustls-pki-types = "1"
rcgen = "0.13"
clap = { version = "4", features = ["derive"] }
dirs = "5"